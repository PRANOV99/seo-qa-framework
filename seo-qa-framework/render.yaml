services:
  - type: web
    name: seo-qa-api
    runtime: docker
    plan: free
    # The Dockerfile lives inside the backend subfolder of this monorepo,
    # so both paths below are pointed at seo-qa-framework/, not the repo
    # root.
    dockerfilePath: ./seo-qa-framework/Dockerfile
    dockerContext: ./seo-qa-framework
    # Render pings this path to confirm the container is actually serving
    # traffic (not just that the process started) before routing to it.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        # Must match your Vercel frontend's real origin (no trailing slash).
        # Update this if your Vercel URL ever changes.
        value: https://seo-qa-framework.vercel.app
      # UPLOAD_DIR lives under /tmp because Render Free web services cannot
      # attach persistent disks — every path outside the deployed image is
      # ephemeral and is wiped on every restart or redeploy either way, so
      # there's no downside to being explicit about it. Uploaded audit
      # sheets are meant to be transient regardless (deleted right after
      # parsing).
      - key: UPLOAD_DIR
        value: /tmp/seo-qa-uploads
      # Audit *history* used to live under /tmp too and was genuinely lost
      # on every restart/redeploy — it now persists in PostgreSQL (Neon)
      # instead, so HISTORY_DIR is no longer used by the API at all.
      # DATABASE_URL is intentionally NOT set here — `sync: false` means
      # Render prompts for it once in the dashboard instead of it living in
      # this committed file. Set it to the Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: HEADLESS
        value: "true"
      - key: LOG_LEVEL
        value: info
      # No PLAYWRIGHT_BROWSERS_PATH here on purpose. The Dockerfile's base
      # image (mcr.microsoft.com/playwright) already ships Chromium/Firefox
      # /WebKit pre-installed and already points Playwright at them itself.
      # Setting this env var — here or anywhere else — would override that
      # and point Playwright at an empty directory, reintroducing the
      # "Executable doesn't exist" error this whole file exists to avoid.
